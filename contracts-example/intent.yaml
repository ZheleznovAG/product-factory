apiVersion: productfactory.io/v1
kind: IntentSpec

outcome:
  goal: "Помочь пользователю регулярно концентрироваться на глубокой работе."
  result: "К концу сессии есть ощутимый прогресс по одной приоритетной задаче."
  successSignals:
    - "Пользователь завершил минимум один важный подэтап"
    - "Не было переключений контекста во время фокус-блока"

