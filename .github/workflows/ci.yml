# CI for Product Factory: Kotlin app, contract validation, regression quality gates.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  kotlin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle build --no-daemon

  release-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release policy controls (SBOM/signature/manual approval)
        run: python3 ci/release_policy_gate.py --workflow .github/workflows/release.yml

  supply-chain-factory:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      TRIVY_FAIL_SEVERITY: HIGH,CRITICAL
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t product-factory:ci .

      - name: Resolve image reference
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=ghcr.io/${OWNER}/${REPO}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        run: |
          docker tag product-factory:ci "${{ env.IMAGE_REF }}"
          docker push "${{ env.IMAGE_REF }}"

      - name: Resolve pushed image digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{.Manifest.Digest}}')"
          if [ -z "${DIGEST}" ]; then
            echo "Unable to resolve pushed image digest for ${IMAGE_REF}" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST_REF=${IMAGE_REPO}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Generate SBOM (Syft, CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-product-factory-${{ github.sha }}
          path: sbom-cyclonedx.json

      - name: Scan image vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          severity: ${{ env.TRIVY_FAIL_SEVERITY }}
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (Cosign keyless)
        run: cosign sign --yes "${{ env.IMAGE_REF }}"

      - name: Verify image signature (Cosign)
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.IMAGE_REF }}"

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Verify SLSA provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${IMAGE_DIGEST_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type "https://slsa.dev/provenance/v1"

  live-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack (compose)
        run: |
          docker compose -f deploy/docker-compose.yml build factory
          docker compose -f deploy/docker-compose.yml up -d
          echo "Waiting for factory health..."
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://localhost:9080/health || (docker compose -f deploy/docker-compose.yml logs; exit 1)
      - name: Run live run scripts and build SLO artifact
        run: |
          mkdir -p ci-artifacts
          START_TS=$(date +%s)
          ./scripts/run_live_run.sh
          bash ./scripts/run_intent_to_run.sh
          END_TS=$(date +%s)
          DURATION_SECONDS=$((END_TS - START_TS))
          NOW_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > ci-artifacts/live_run_summary.json <<EOF
          {
            "source": "ci-live-run",
            "generated_at": "${NOW_UTC}",
            "metrics": {
              "run_success_rate_percent": 100.0,
              "run_latency_p50_seconds": ${DURATION_SECONDS},
              "run_latency_p99_seconds": ${DURATION_SECONDS}
            }
          }
          EOF
        env:
          FACTORY_URL: http://localhost:9080
          FACTORY_RUN_TIMEOUT: 90
      - name: Upload live-run summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-run-summary-${{ github.sha }}
          path: ci-artifacts/live_run_summary.json
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans || true

  slo-gate:
    runs-on: ubuntu-latest
    needs: [live-run]
    steps:
      - uses: actions/checkout@v4
      - name: Download live-run summary artifact
        uses: actions/download-artifact@v4
        with:
          name: live-run-summary-${{ github.sha }}
          path: ci-artifacts
      - name: Enforce SLO thresholds
        run: |
          python3 ci/slo_gate.py \
            --input ci-artifacts/live_run_summary.json \
            --mode live \
            --thresholds-config ci/slo-thresholds.json

  eval-regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect eval-impacting changes
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            eval_gate:
              - "prompts/**"
              - "policies/opa/**"
              - "contracts/tools.schema.json"
              - "contracts/tools.registry.example.json"
              - "docs/tools-list-mvp.md"
              - "docs/eval-ragas.md"
              - "eval-ragas.md"
              - "eval/**"
              - "ci/quality_gates.py"
      - name: Run trace eval regression gate
        if: steps.changed.outputs.eval_gate == 'true'
        run: |
          python3 ci/quality_gates.py \
            --mode agent \
            --dataset eval/datasets/agent_trace_minimal.json \
            --min-pass-rate 1.0 \
            --min-average-score 0.95
      - name: Run RAGAs eval regression gate
        if: steps.changed.outputs.eval_gate == 'true'
        run: |
          python3 ci/quality_gates.py \
            --mode ragas \
            --dataset eval/datasets/ragas_minimal.json \
            --min-pass-rate 1.0 \
            --min-average-score 1.0
      - name: Skip eval gate (no relevant changes)
        if: steps.changed.outputs.eval_gate != 'true'
        run: echo "No prompts/policy/tool/eval changes detected; regression gate skipped."
