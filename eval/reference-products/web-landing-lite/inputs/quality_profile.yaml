apiVersion: productfactory.io/v1
kind: QualityProfile
testing:
  unitCoverageMinPercent: 65
  integrationTestsRequired: false
  smokeTestsRequired: true
securityGates:
  sbom:
    format: cyclonedx
    required: true
  vulnerabilityScan:
    tool: trivy
    failOnSeverity: [HIGH, CRITICAL]
  signing:
    tool: cosign
    required: false
observability:
  tracing:
    required: true
    protocol: otlp
  metrics:
    required: true
sloGate:
  enabled: true
  maxGenerationTimeSeconds: 600
  maxPolicyDenySharePercent: 5
  minSuccessRatePercent: 95
  lookbackRuns: 20

