apiVersion: productfactory.io/v1
kind: ProductSpec
metadata:
  productId: ref-catalog-api-mvp
  owner: platform-team
  createdAt: "2026-02-26"
product:
  type: api-service
  name: Reference Catalog API
  description: Planner regression reference product for catalog-service strategy.
  interfaces:
